<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiza</title>
    <!-- Выбранная тема ставится до отрисовки, чтобы страница не мигала светлым. -->
    <script>try{const t=localStorage.getItem("tiza:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="stylesheet" href="/src/base.css" />
    <link rel="stylesheet" href="/src/board.css" />
  </head>
  <body>
    <canvas id="board"></canvas>

    <header class="board-header">
      <a id="back" href="/">← Мои ученики</a>
      <span id="topic-title"></span>
    </header>
    <p id="notice" class="notice" role="status" hidden></p>

    <!-- Полка как под школьной доской: сверху лежат мелки и губка, на передней грани кнопки. -->
    <div class="tray">
      <div id="palette" class="shelf" role="toolbar" aria-label="Инструменты">
        <button class="pointer" data-tool="pointer" aria-pressed="false" aria-label="Указка: выбрать, двигать и менять размер (V). Уголок с Shift — свободные пропорции" title="Указка (V). Тяни за уголок; с Shift — свободные пропорции"></button>
        <button class="chalk" data-color="#25231f" style="--chalk: var(--chalk-ink)" aria-pressed="true" aria-label="Мел, графит (1)" title="Графит (1)"></button>
        <button class="chalk" data-color="#ae4f29" style="--chalk: var(--chalk-red)" aria-pressed="false" aria-label="Мел, терракота (2)" title="Терракота (2)"></button>
        <button class="chalk" data-color="#33589e" style="--chalk: var(--chalk-blue)" aria-pressed="false" aria-label="Мел, синий (3)" title="Синий (3)"></button>
        <button class="sponge" data-tool="eraser" aria-pressed="false" aria-label="Губка: стереть линию (E)" title="Губка (E)"></button>
        <button id="add-image" class="picture" aria-label="Вставить картинку из файла (или Ctrl+V для скриншота)" title="Картинка: файл или Ctrl+V"></button>
        <input id="image-file" type="file" accept="image/*" hidden />
        <button id="add-doc" class="doc" aria-label="Задания из Word: каждое задание станет карточкой на доске" title="Задания из Word (.docx)"></button>
        <input id="doc-file" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden />
      </div>

      <div class="ledge">
        <div class="group">
          <button id="undo" class="icon" aria-label="Отменить (Ctrl+Z)" title="Отменить (Ctrl+Z)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 010 11H11" /></svg>
          </button>
          <button id="redo" class="icon" aria-label="Вернуть (Ctrl+Shift+Z)" title="Вернуть (Ctrl+Shift+Z)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5" /><path d="M20 9H9.5a5.5 5.5 0 000 11H13" /></svg>
          </button>
        </div>

        <div class="group">
          <button class="theme-toggle" aria-label="Сменить тему"></button>
          <button id="zoom-out" class="icon" aria-label="Отдалить" title="Отдалить">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
          </button>
          <button id="zoom-reset" class="zoom" aria-label="Вернуть масштаб 100% (Ctrl+0)" title="Вернуть масштаб 100% (Ctrl+0)">100%</button>
          <button id="zoom-in" class="icon" aria-label="Приблизить" title="Приблизить">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/board.ts"></script>
  </body>
</html>
