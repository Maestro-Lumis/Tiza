<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiza: ученики</title>
    <!-- Выбранная тема ставится до отрисовки, чтобы страница не мигала светлым. -->
    <script>try{const t=localStorage.getItem("tiza:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="stylesheet" href="/src/base.css" />
    <link rel="stylesheet" href="/src/pages.css" />
  </head>
  <body>
    <main class="page">
      <header>
        <button class="theme-toggle" aria-label="Сменить тему"></button>
        <p class="logo">tiza</p>
        <h1>Мои ученики</h1>
      </header>

      <ul id="students" class="students"></ul>
      <p id="empty" class="empty" hidden>Учеников пока нет. Добавь первого: у него появятся свои темы и доски.</p>

      <form id="add" class="add" novalidate>
        <label for="name">Новый ученик</label>
        <div class="row">
          <input id="name" name="name" autocomplete="off" placeholder="Андрей" />
          <button type="submit">Добавить ученика</button>
        </div>
        <p id="error" class="error" hidden>Впиши имя ученика.</p>
      </form>
    </main>

    <script type="module" src="/src/home.ts"></script>
  </body>
</html>
