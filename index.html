<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiza</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="board"></canvas>

    <div id="palette" role="group" aria-label="Цвет мела">
      <button data-color="#25231f" style="--chalk: #25231f" aria-pressed="true" aria-label="Мел, графит (1)" title="Графит (1)"></button>
      <button data-color="#ae4f29" style="--chalk: #ae4f29" aria-pressed="false" aria-label="Мел, терракота (2)" title="Терракота (2)"></button>
      <button data-color="#33589e" style="--chalk: #33589e" aria-pressed="false" aria-label="Мел, синий (3)" title="Синий (3)"></button>
      <button class="sponge" data-tool="eraser" aria-pressed="false" aria-label="Губка: стереть линию (E)" title="Губка (E)"></button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
